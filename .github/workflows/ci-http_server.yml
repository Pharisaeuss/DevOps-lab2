name: CI/CD HTTP_Server

on:
  push:
    branches: [branchHTTPserver]
  pull_request:
    branches: [branchHTTPserver]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ automake autoconf libboost-test-dev

      - name: Auto generate configure script
        run: |
          autoreconf --install
        
      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Run configure script
        run: ./configure
      
      - name: Build with Makefile
        run: make

      - name: Docker buildx
        run: docker buildx ls

      - name: Log in to Docker Hub
        run: docker login -u ${{secrets.docker_username}} -p ${{secrets.docker_token}}

      - name: Imaged build for amd64
        run: docker build --platform=linux/amd64 -t ${{secrets.docker_username}}/dev-ops_lab4:amd64 --push

      - name: Imaged build for arm64
        run: docker build --platform=linux/arm64 -t ${{secrets.docker_username}}/dev-ops_lab4:arm64 --push

      - name: Create Docker manifest
        run: docker manifest create ${{secrets.docker_username}}/dev-ops_lab4 --amend ${{secrets.docker_username}}/dev-ops_lab4:amd64 --amend ${{secrets.docker_username}}/dev-ops_lab4:arm64

      - name: Push docker manifest to Docker Hub
        run: docker manifest push ${{secrets.docker_username}}/dev-ops_lab4
